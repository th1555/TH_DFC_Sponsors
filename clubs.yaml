# One entry per club. club_sponsors.py finds each club's website from Wikidata
# (the data behind Wikipedia) unless `website` is given here, then finds the
# sponsor / partner / commercial pages on it. Add `website` or `sponsor_pages`
# when the automatic route misses (the coverage report lists those clubs), and
# `skip: true` for a club with no website (many only post on Facebook).
#
# tier: 1-4 SPFL, 5 Highland / Lowland League, 6-10 West of Scotland League.
# near: within roughly 30 km of Dumbarton, so its sponsors are likely local.
#
# Sources: Wikipedia 2026/27 league pages (SPFL, Highland, Lowland), and the
# West of Scotland League club directory (wosfl.co.uk), checked 20 Oct 2026.
# Update once a season after promotion and relegation.
