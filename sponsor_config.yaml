# --- what to offer, at what price ---------------------------------------------
# From the club's 2026/27 commercial page (dumbartonfootballclub.com/club/commercial),
# prices in GBP plus VAT. The suggestion is sized to the business, so a micro firm
# is pitched a £100 player sponsorship, not a £3,000 kit slot. Update each season.
offers:
  source: "Dumbarton FC commercial page, 2026/27 (GBP, plus VAT)"
  by_size:
    micro:   "player sponsor (£100–£200), concourse advert (from £100) or stadium steps (from £50)"
    small:   "Women's or U20 kit slot (£300), single pitchside board (£800) or ball sponsor with hospitality for 8 (£600)"
    medium:  "double pitchside board (£1,500), matchball pods (from £1,000) or a men's kit slot (£3,000)"
    large:   "Women's team front of shirt (£5,000), stadium/stand naming or media partner (on request)"
    unknown: "Women's or U20 kit slot (£300) or single pitchside board (£800)"
  by_audience:               # added for small firms and up
    B2B:       "match sponsor hospitality for 8 (£800) to entertain clients"
    Consumer:  "social media package (from £100) alongside a board, for footfall"
    Community: "Women's or U20 team packages (£300) for youth and community association"
