# =============================================================================
# sponsor_config.yaml  —  Dumbarton FC Sponsor Intelligence Tool
# =============================================================================
# All tuning lives here so weights + the sector table change WITHOUT touching
# code. The whole design philosophy is in one line of these weights:
# community affinity + proximity dominate; raw company size is deliberately
# light. Dumbarton sells LOCAL AFFINITY, not reach (~700 avg attendance).
# -----------------------------------------------------------------------------

# --- composite weights (must sum to 100) -------------------------------------
# Each feature is normalised to 0..1, multiplied by its weight, summed -> 0..100.
weights:
  community_affinity: 22   # LLM soft feature — the headline: local pride / rootedness
  proximity:          20   # deterministic — distance decay from the ground
  sector_propensity:  15   # deterministic lookup (v2: REPLACED by lookalike_score)
  brand_fit:          12   # LLM soft feature — does backing a club suit them
  company_stability:  11   # deterministic — are they solvent & actually trading
  csr_signal:         10   # LLM soft feature — visible community-mindedness
  ability_to_pay:     10   # deterministic — size band, kept LIGHT on purpose

# --- proximity: exponential decay on distance from the stadium ---------------
proximity:
  decay_km: 6.0            # score = exp(-distance_km / decay_km); ~0.4 at 6km

# --- ability to pay: size band -> 0..1 (light-weighted, so size can't dominate)
ability_to_pay:
  micro:  0.35
  small:  0.60
  medium: 0.85
  large:  1.00
  unknown: 0.50

# --- company stability: trust from age, penalty for dormant accounts ---------
stability:
  age_scale_years: 5.0     # score = 1 - exp(-age/scale); saturates with age
  dormant_penalty: 0.5     # multiply score by this if accounts are dormant

# --- LLM soft-feature guardrail ----------------------------------------------
# Low-confidence reads pull toward neutral rather than swinging the score:
#   effective = value*confidence + neutral*(1-confidence)
soft_features:
  neutral: 0.5

# --- sector propensity table -------------------------------------------------
# Authored from lower-league Scottish sponsorship patterns. The v2 lookalike
# engine LEARNS this from real data and replaces it — for now it's the honest
# hand table (flagged as such in any pitch).
sector_propensity:
  transport_coaches_haulage:            0.90   # proven (Marbill: stadium + U20 shirts)
  industrial_b2b_services:              0.85   # the club's actual sponsor mix: print (JJR),
                                               # rail systems (C&G), gas (Algas), tools (Gedore),
                                               # signage (Signs Express) - see connections.csv
  building_construction_trades:         0.90   # classic lower-league backbone
  pubs_bars_hospitality:                0.85   # matchday-adjacent, community-facing
  motor_dealers_garages:                0.85   # owner-led, board & programme regulars
  local_professional_services:          0.75   # accountants/solicitors/estate agents
  funeral_directors:                    0.70   # consistently loyal at this level
  food_takeaway_restaurants:            0.70   # local, footfall overlap
  utilities_renewables_heating:         0.70   # cash-generative trades wanting trust
  health_fitness_physio_dental:         0.65   # community-facing, audience overlap
  independent_retail:                   0.60   # willing but smaller budgets
  national_chain:                       0.20   # decisions not local; affinity misses
  online_ecommerce:                     0.25   # no local-visibility motive
  public_sector_charity:                0.30   # rarely a paying sponsor (flag as partner)
  unknown:                              0.45   # unclassified — neutral-ish default

# --- tier recommendation: business type -> suggested inventory ---------------
# Separate OUTPUT from the score. Matches prospect type to what to offer.
tier_map:
  transport_coaches_haulage:    "B2B — programme, website, training-wear"
  building_construction_trades: "B2B — programme, website, training-wear"
  industrial_b2b_services:      "B2B — hospitality for clients, boards, kit"
  local_professional_services:  "B2B — programme, website, training-wear"
  utilities_renewables_heating: "B2B — programme, website, training-wear"
  pubs_bars_hospitality:        "Consumer — matchday, hospitality, visible board"
  motor_dealers_garages:        "Consumer — matchday, hospitality, visible board"
  food_takeaway_restaurants:    "Consumer — matchday, hospitality, visible board"
  independent_retail:           "Consumer — matchday, hospitality, visible board"
  funeral_directors:            "Community — programme + community-programme naming"
  health_fitness_physio_dental: "Community — bundle the 4G pitch (pitch-time/naming)"
  public_sector_charity:        "Partner (not paid sponsor) — flag separately"
  national_chain:               "Low priority — decisions likely not local (if a franchise, ask for the local owner)"
  online_ecommerce:             "Low priority — no local-visibility motive"
  unknown:                      "Review — classify sector first"

# --- data ingestion (the real-data layer) ------------------------------------
# Official APIs, so unlike the recruitment scrapers these don't block cloud IPs.
ingest:
  stadium:                   # Dumbarton FC — "The Rock" (naming rights: Marbill Coaches, 2026/27)
    name: "Marbill Coaches Stadium"
    lat: 55.9369
    lng: -4.5583
  places:
    radius_m: 25000          # search bias around the ground (Google's max is 50 km)
    max_distance_km: 25.0    # hard ceiling: Google's radius is only a bias, and
                             # without it results came back from up to 54 km.
                             # Inside it, distance is SCORED (decay) and FILTERED
                             # on the page, not cut, so a well-connected firm
                             # further out can still rank.
    max_per_query: 20
    # Each seed query runs once per town ("coach hire in Alexandria"), so a wide
    # radius doesn't let Glasgow results crowd out the businesses near the ground.
    towns: ["Dumbarton", "Alexandria", "Balloch", "Helensburgh", "Clydebank", "Erskine"]
    seed_queries:            # one per local sector we prospect (location-biased)
      - "coach hire"
      - "haulage"
      - "builders"
      - "joiner"
      - "pub"
      - "car dealership"
      - "garage MOT"
      - "accountant"
      - "solicitor"
      - "estate agent"
      - "funeral director"
      - "takeaway"
      - "restaurant"
      - "plumber heating"
      - "physiotherapy"
      - "dental practice"
      - "hardware shop"
      # added Oct 2026: the kinds of firm that actually sponsor Dumbarton
      # (print, signage, engineering, tiling, industrial suppliers) were never searched
      - "printing"
      - "signs"
      - "engineering"
      - "industrial supplies"
      - "tiling"
      - "electrical contractor"
  companies_house:
    match_min_score: 0.60    # name-similarity floor to accept a CH match (else flag)
    # A name match must ALSO agree on place (data_checks.location_agreement):
    # same postcode district, or registered / registered office in Scotland.
    # Name-only matches to companies registered elsewhere are not linked.
    home_areas: [G, PA]      # a Scottish match with its office outside these is kept but flagged

# --- local connections ---------------------------------------------------------
# A recorded link to the town or club counts as local presence: the proximity
# part scores max(distance score, connection strength), so a firm 20 km away
# whose director lives in Dumbarton, or who already sponsors the club, isn't
# buried by distance. All three sources are recorded facts, so they count on the
# shipped page. The AI's "possible connection" reading is NOT scored: it's shown
# on the lab page as a lead for a person to confirm (then add to the CSV).
connections:
  file: connections.csv      # club-maintained: match, kind, note
  strength:                  # by kind (the `kind` column in connections.csv)
    current_sponsor: 1.0     # sponsoring now -> shown as a Renewal
    past_sponsor: 0.9        # sponsored before -> a Win-back prospect
    warm_intro: 0.9          # someone at the club has a way in
    club_recorded: 1.0       # any other link the club records
    local_director: 0.75     # a Companies House director based in a local district
    not_a_fit: 0.0           # the club has ruled it out -> hidden by default
  local_districts: [G82, G83, G84, G81, G60]   # Dumbarton, Vale of Leven, Helensburgh, Clydebank, Bowling

# --- chains & franchises -------------------------------------------------------
